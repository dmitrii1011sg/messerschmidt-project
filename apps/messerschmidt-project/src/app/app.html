<main
  class="relative h-dvh w-screen overflow-hidden bg-[#EAE6DF] font-sans text-slate-800"
>
  <msdt-map class="absolute inset-0 z-0"></msdt-map>

  <header
    class="pointer-events-none absolute left-0 right-0 top-0 z-10 flex flex-col items-center justify-between p-4 md:flex-row md:p-6 text-center md:text-left drop-shadow-md"
  >
    <div
      class="pointer-events-auto rounded-lg bg-[#F4F1EA]/90 px-5 py-3 backdrop-blur-md border border-[#8B4513]/20 shadow-lg"
    >
      <h1 class="font-serif text-xl md:text-2xl font-bold text-[#3E2723]">
        Путешествие Д.Г. Мессершмидта
      </h1>
      <p class="font-serif text-sm italic text-[#5D4037] mt-1">
        Экспедиция по реке Лена (1720–1727)
      </p>
    </div>

    <div
      class="pointer-events-auto mt-2 md:mt-0 hidden md:block rounded-lg bg-[#F4F1EA]/90 px-4 py-2 backdrop-blur-md border border-[#8B4513]/20"
    >
      <span class="text-xs font-bold uppercase tracking-wider text-[#8B4513]">
        Миллеровские чтения
      </span>
    </div>
  </header>

  <div
    class="absolute bottom-4 left-4 right-4 z-20 md:bottom-8 md:left-8 md:right-auto md:w-80 rounded-xl bg-[#F4F1EA]/95 p-5 shadow-xl backdrop-blur-md border-2 border-[#8B4513]/10"
  >
    <div
      class="mb-3 flex items-center justify-between border-b border-[#8B4513]/10 pb-2"
    >
      <span class="font-serif text-sm font-bold tracking-wide text-[#5D4037]">
        Карта 1720 г.
      </span>
      <span class="font-mono text-sm font-bold text-[#8B4513]">
        {{ (opacity() * 100).toFixed(0) }}%
      </span>
    </div>

    <div class="relative flex items-center py-2">
      <input
        type="range"
        min="0"
        max="1"
        step="0.01"
        [value]="opacity()"
        (input)="onOpacityChange($event)"
        class="peer h-2 w-full appearance-none rounded-full bg-[#D7CCC8] outline-none cursor-pointer accent-[#8B4513] focus:ring-2 focus:ring-[#8B4513]/30 transition-all"
        aria-label="Регулировка прозрачности исторической карты"
      />
    </div>
  </div>
</main>
