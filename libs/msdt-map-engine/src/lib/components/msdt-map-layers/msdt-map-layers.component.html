@if (routeGeoJson.features?.length || routeGeoJson.geometry) {
  <mgl-geojson-source
    id="route-source"
    [data]="routeGeoJson"
    [lineMetrics]="true"
  ></mgl-geojson-source>

  <mgl-layer
    id="msdt-line-shadow"
    type="line"
    source="route-source"
    [paint]="{
      'line-color': '#000',
      'line-width': 10,
      'line-blur': 15,
      'line-opacity': 0.3,
    }"
  ></mgl-layer>

  <mgl-layer
    id="msdt-line-halo"
    type="line"
    source="route-source"
    [paint]="{
      'line-color': '#F4F1EA',
      'line-width': 5,
      'line-opacity': 0.8,
    }"
  ></mgl-layer>

  <mgl-layer
    id="msdt-line-main"
    type="line"
    source="route-source"
    [layout]="{ 'line-cap': 'round', 'line-join': 'round' }"
    [paint]="{
      'line-color': '#5D4037',
      'line-width': 3,
      'line-dasharray': [2, 1],
    }"
  ></mgl-layer>
}

@if (pointsGeoJson.features?.length > 0) {
  <mgl-geojson-source
    id="points-source"
    [data]="pointsGeoJson"
  ></mgl-geojson-source>
  <mgl-image id="icon-garden" url="icons/garden.webp"></mgl-image>
  <mgl-image id="icon-wetland" url="icons/wetland.webp"></mgl-image>
  <mgl-image id="icon-home" url="icons/home.webp"></mgl-image>
  <mgl-image id="icon-library" url="icons/library.webp"></mgl-image>
  <mgl-image id="icon-mountain" url="icons/mountain.webp"></mgl-image>
  <mgl-image id="icon-park-alt1" url="icons/park-alt1.webp"></mgl-image>
  <mgl-image id="icon-park" url="icons/park.webp"></mgl-image>

  <mgl-layer
    id="unclustered-point-background"
    type="circle"
    source="points-source"
    [filter]="filter()"
    [paint]="{
      'circle-color': '#F4F1EA',
      'circle-radius': 14,
      'circle-opacity': 0.7,
    }"
    (layerClick)="onPointClick($event)"
    (layerMouseEnter)="cursorToPointer($event)"
    (layerMouseLeave)="cursorToDefault($event)"
  ></mgl-layer>

  <mgl-layer
    id="unclustered-point"
    type="symbol"
    source="points-source"
    [filter]="filter()"
    [layout]="{
      'icon-allow-overlap': true,
      'icon-ignore-placement': true,
      'text-allow-overlap': true,
      'text-ignore-placement': true,
      'icon-image': [
        'match',
        ['get', 'category'],
        'settlement',
        'icon-home',
        'garden',
        'icon-garden',
        'mountain',
        'icon-mountain',
        'forest',
        'icon-park-alt1',
        'river',
        'icon-wetland',
        'icon-library',
      ],
      'icon-size': 0.5,
      'text-field': ['get', 'origin_name'],
      'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'],
      'text-size': 12,
      'text-offset': [0, 1.5],
      'text-anchor': 'top',
    }"
    [paint]="{
      'icon-halo-color': '#F4F1EA',
      'icon-halo-width': 2,
      'text-color': '#000000',
      'text-halo-color': '#F4F1EA',
      'text-halo-width': 1,
    }"
    (layerClick)="onPointClick($event)"
    (layerMouseEnter)="cursorToPointer($event)"
    (layerMouseLeave)="cursorToDefault($event)"
  ></mgl-layer>
  <mgl-layer
    id="clusters"
    type="circle"
    source="points-source"
    [filter]="['has', 'point_count']"
    [paint]="{
      'circle-color': [
        'step',
        ['get', 'point_count'],
        '#D4A373',
        5,
        '#A98467',
        15,
        '#6B705C',
      ],
      'circle-radius': ['step', ['get', 'point_count'], 15, 5, 15, 15, 25],
      'circle-stroke-width': 2,
      'circle-stroke-color': '#F4F1EA',
    }"
    (layerClick)="onClusterClick($event)"
    (layerMouseEnter)="cursorToPointer($event)"
    (layerMouseLeave)="cursorToDefault($event)"
  ></mgl-layer>

  <mgl-layer
    id="cluster-count"
    type="symbol"
    source="points-source"
    [filter]="['has', 'point_count']"
    [layout]="{
      'text-field': '{point_count_abbreviated}',
      'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'],
      'text-size': 14,
    }"
    [paint]="{ 'text-color': '#ffffff' }"
  ></mgl-layer>
}
