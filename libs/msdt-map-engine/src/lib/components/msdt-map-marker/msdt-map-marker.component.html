<mgl-marker [lngLat]="stop().coordinates">
  <button
    class="group relative flex h-7 w-7 items-center justify-center"
    (click)="selectMarker.emit(stop())"
  >
    <div
      class="absolute inset-0 rotate-12 rounded-full bg-red-800 opacity-80 shadow-lg transition-transform group-hover:scale-110"
    ></div>
    <div
      class="absolute inset-0 -rotate-12 rounded-full bg-red-700 opacity-90 shadow-inner"
    ></div>

    <div
      class="relative flex h-5 w-5 items-center justify-center rounded-full border border-red-900 bg-red-800 text-[10px] font-serif font-bold text-red-300 drop-shadow-sm"
    >
      M
    </div>

    <span
      class="absolute left-6 font-serif text-xs italic text-[#3E2723] opacity-0 transition-opacity group-hover:opacity-100 bg-[#F4F1EA]/80 px-1 rounded"
    >
      {{ stop().name }}
    </span>
  </button>
</mgl-marker>
